<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Crisp pixel shadow for contrast on both dark and light browser tabs -->
  <filter id="retro-shadow" x="-10%" y="-10%" width="125%" height="125%">
    <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
  </filter>

  <g filter="url(#retro-shadow)">
    <!-- RAGE FLAME PARTICLES (Licking off the top of the Windows flag) -->
    <!-- Outer Orange-Red Flame -->
    <path d="M14 16 C12 11, 14 6, 18 2 C20 7, 23 8, 22 13 C24 9, 27 6, 31 4 C33 9, 31 13, 33 16 Z" fill="#FF3300" />
    <!-- Inner Golden-Yellow Core -->
    <path d="M16 16 C15 12, 17 9, 19 6 C20 9, 23 10, 22 13 C23 11, 26 9, 29 8 C29 11, 28 14, 29 16 Z" fill="#FFCC00" />
    <circle cx="21" cy="4" r="1.5" fill="#FFEE55" />
    <circle cx="33" cy="6" r="1.5" fill="#FF6600" />

    <!-- WINDOWS 95/98 4-COLOR WAVING FLAG BODY -->
    <!-- Black border outline for authentic 90s OS pixel-crisp look -->
    <g stroke="#000000" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- 1. Top-Left: Fiery Rage Red Tile -->
      <path d="M9 17 C16 14, 23 19, 28 17 L28 31 C23 33, 16 28, 9 31 Z" fill="#FF2A2A" />

      <!-- 2. Top-Right: Retro Win95 Green Tile -->
      <path d="M31 16.5 C37 14, 44 19, 50 16.5 L50 30.5 C44 33, 37 28, 31 30.5 Z" fill="#00D044" />

      <!-- 3. Bottom-Left: Deep Windows Blue Tile -->
      <path d="M9 34 C16 31, 23 36, 28 34 L28 48 C23 50, 16 45, 9 48 Z" fill="#0074E4" />

      <!-- 4. Bottom-Right: Retro Windows Yellow Tile -->
      <path d="M31 33.5 C37 31, 44 36, 50 33.5 L50 47.5 C44 50, 37 45, 31 47.5 Z" fill="#FFB703" />
    </g>

    <!-- Beveled Highlights (Classic Win95 3D Lighting) -->
    <!-- Top Highlights on Tiles -->
    <path d="M10 18 C16 15.5, 23 20, 27 18" stroke="#FFAAAA" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M32 17.5 C37 15.5, 44 20, 49 17.5" stroke="#AAFFAA" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M10 35 C16 32.5, 23 37, 27 35" stroke="#80C4FF" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M32 34.5 C37 32.5, 44 37, 49 34.5" stroke="#FFF0A0" stroke-width="1.4" stroke-linecap="round" fill="none" />

    <!-- Angry "Rage" Slanted Brow & Eyes Overlay across the upper tiles -->
    <!-- Left Angry Eyebrow & Eye (on Red Tile) -->
    <path d="M13 22 L20 25" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="square" />
    <rect x="15" y="26" width="3" height="3" fill="#FFFFFF" />

    <!-- Right Angry Eyebrow & Eye (on Green Tile) -->
    <path d="M46 22 L39 25" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="square" />
    <rect x="41" y="26" width="3" height="3" fill="#FFFFFF" />

    <!-- Authentic Win95 Motion Pixel Trail (Squares trailing to the right) -->
    <rect x="53" y="19" width="3.5" height="3.5" fill="#00D044" stroke="#000000" stroke-width="1" />
    <rect x="58" y="23" width="2.5" height="2.5" fill="#00D044" stroke="#000000" stroke-width="0.8" />

    <rect x="53" y="36" width="3.5" height="3.5" fill="#FFB703" stroke="#000000" stroke-width="1" />
    <rect x="58" y="40" width="2.5" height="2.5" fill="#FFB703" stroke="#000000" stroke-width="0.8" />

    <!-- Tiny spark trailing left -->
    <rect x="4" y="24" width="2.5" height="2.5" fill="#FF2A2A" stroke="#000000" stroke-width="0.8" />
    <rect x="4" y="41" width="2.5" height="2.5" fill="#0074E4" stroke="#000000" stroke-width="0.8" />
  </g>
</svg>